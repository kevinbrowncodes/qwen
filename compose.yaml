# compose.yaml — the UI side of Qwen Local on the Spark (STORY_005). Project "qwen".
#
#   gate      the toolchain image with the repo bind-mounted: every gate step runs here   -> tools/gate/run.sh
#   app-dev   the same image running `next dev` with hot reload, on port 3100 for the owner's browser (profile "dev")
#   app       the production image (app/Dockerfile) serving the built UI on port 3100    -> docker compose up -d app
#   proxy     Caddy on port 80: http://qwen.local -> the app, any other name a 404 (CHORE_004)
#   lan-name  answers mDNS queries for qwen.local with the Spark's LAN address, beside avahi (CHORE_004)
#
# Only one of app-dev / app runs at a time (both publish 3100). Port 3000 on the Spark is the minimax app's; never
# bind it. The model side is spark/compose.yaml (STORY_016): the app joins its docker network "qwen" and reaches the
# model server as qwen-model:4120 through MODEL_BASE_URL only (start the model first: spark/up.sh). The gate never
# joins that network: every test targets the stub. SPARK_UID/SPARK_GID
# are set by the scripts so files in the bind mount stay the owner's.
name: qwen

x-gate-image: &gate-image qwen/gate:${GATE_TAG:-1.63.0-node26}
x-gate-mounts: &gate-mounts
  - .:/work
  - pnpm-store:/pnpm-store

services:
  gate:
    build:
      context: tools/gate
      args:
        UID: ${SPARK_UID:-1000}
        GID: ${SPARK_GID:-1000}
    image: *gate-image
    profiles: ["tools"]
    user: "${SPARK_UID:-1000}:${SPARK_GID:-1000}"
    working_dir: /work
    volumes: *gate-mounts
    environment:
      HOME: /tmp/gate-home

  app-dev:
    image: *gate-image
    profiles: ["dev"]
    container_name: qwen-app-dev
    user: "${SPARK_UID:-1000}:${SPARK_GID:-1000}"
    working_dir: /work
    command: ["pnpm", "--filter", "app", "dev", "--hostname", "0.0.0.0", "--port", "3100"]
    ports:
      - "${APP_PORT:-3100}:3100"
    volumes: *gate-mounts
    environment:
      HOME: /tmp/gate-home
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://qwen-model:4120}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      HISTORY_FILE: /tmp/gate-home/history.json
    networks: [default, qwen]

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: qwen/app:${APP_TAG:-dev}
    container_name: qwen-app
    ports:
      - "${APP_PORT:-3100}:3100"
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://qwen-model:4120}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      HISTORY_FILE: /data/history.json
    volumes:
      - app-data:/data
    networks: [default, qwen]
    restart: unless-stopped

  proxy:
    image: caddy:2.11.4-alpine
    container_name: qwen-proxy
    ports:
      - "80:80"
    volumes:
      - ./tools/lan-name/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

  lan-name:
    build: tools/lan-name
    image: qwen/lan-name:dev
    container_name: qwen-lan-name
    network_mode: host
    environment:
      LAN_NAME: qwen.local
    restart: unless-stopped

networks:
  # Shared with the model side (spark/compose.yaml); created by spark/up.sh.
  qwen:
    name: qwen
    external: true

volumes:
  pnpm-store: {}
  app-data: {}   # the UI's history (STORY_007)
