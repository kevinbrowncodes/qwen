# compose.yaml — Qwen Local's containers (STORY_005, STORY_037). Project "qwen".
#
#   gate      the toolchain image with the repo bind-mounted: every gate step runs here   -> tools/gate/run.sh
#             (on the Mac Studio 2022's Docker, from the Mac Studio 2025: tools/gate/remote.sh, STORY_034)
#   app       the production image (app/Dockerfile) serving the built UI on port 3100    -> tools/deploy/app.sh
#             (on the Mac Studio 2022, STORY_037). It joins PATHS' network `paths`, whose proxy routes
#             http://qwen.local to it by the caddy labels below and whose Bonjour agent announces the name.
#
# The model server runs natively on the Mac Studio 2026 (STORY_036); the app reaches it only through MODEL_BASE_URL
# and MODEL_API_KEY, from ~/qwen-app/.env on the 2022. The gate never reaches it: every test targets the stub.
# SPARK_UID/SPARK_GID are set by the gate scripts so files in the bind mount stay the owner's.
name: qwen

x-gate-image: &gate-image qwen/gate:${GATE_TAG:-1.63.0-node26}
x-gate-mounts: &gate-mounts
  - .:/work
  - pnpm-store:/pnpm-store

services:
  gate:
    build:
      context: tools/gate
      args:
        UID: ${SPARK_UID:-1000}
        GID: ${SPARK_GID:-1000}
    image: *gate-image
    profiles: ["tools"]
    user: "${SPARK_UID:-1000}:${SPARK_GID:-1000}"
    working_dir: /work
    volumes: *gate-mounts
    environment:
      HOME: /tmp/gate-home

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: qwen/app:${APP_TAG:-dev}
    container_name: qwen-app
    ports:
      - "${APP_PORT:-3100}:3100"
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      HISTORY_FILE: /data/history.json
    volumes:
      - app-data:/data
    networks: [default, paths]
    labels:
      caddy: http://qwen.local
      caddy.reverse_proxy: "{{upstreams 3100}}"
    # always, not unless-stopped: the latter stays down after a daemon restart or a reboot (PATHS BUG_005).
    restart: always

networks:
  # PATHS' network on the Mac Studio 2022 (its `make proxy` creates it): the proxy reaches the app here.
  paths:
    external: true

volumes:
  pnpm-store: {}
  app-data: {}   # the UI's history (STORY_007)
